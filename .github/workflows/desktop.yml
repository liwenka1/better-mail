name: Desktop build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 0.1.1、v0.1.1 或 0.2.0-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual-release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: Prepare release version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare version commit and tag
        id: prepare
        run: node scripts/release-prepare.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT_EMAIL: '2020583117@qq.com'

  build:
    name: ${{ matrix.target }}
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            builder: --mac --arm64
          - target: mac-x64
            runner: macos-15-intel
            builder: --mac --x64
          - target: win-x64
            runner: windows-2022
            builder: --win --x64
          - target: linux-x64
            runner: ubuntu-24.04
            builder: --linux --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.28.2 --ignore-scripts
      - name: Set up Windows native-build Python
        if: runner.os == 'Windows'
        id: windows-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select Windows native-build Python
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NATIVE_PYTHON: ${{ steps.windows-python.outputs.python-path }}
        run: '"PYTHON=$env:NATIVE_PYTHON" >> $env:GITHUB_ENV'
      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
      - name: Verify release version
        run: node scripts/release-check.mjs version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and build
        run: pnpm check
      - name: Verify native SQLite ABI
        run: node scripts/release-check.mjs native ${{ matrix.target }}
      - name: Generate dependency notices
        run: pnpm notices
      - name: Build installers
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never
      - name: Verify packaged runtime
        run: node scripts/release-check.mjs native ${{ matrix.target }} --packaged
      - name: Prepare installer artifacts
        run: node scripts/release-check.mjs stage ${{ matrix.target }}
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: release/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release:
    name: Publish complete release
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    needs: [prepare, build]
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag || github.ref_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release/download
          merge-multiple: true
      - name: Publish verified assets
        run: node scripts/release-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
