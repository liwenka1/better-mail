name: Desktop build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            builder: --mac --arm64
          - target: mac-x64
            runner: macos-15-intel
            builder: --mac --x64
          - target: win-x64
            runner: windows-2025
            builder: --win --x64
          - target: linux-x64
            runner: ubuntu-24.04
            builder: --linux --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.28.2 --ignore-scripts
      - name: Install Linux packaging libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
      - name: Verify release version
        run: node scripts/release-check.mjs version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and build
        run: pnpm check
      - name: Verify native SQLite ABI
        run: node scripts/release-check.mjs native ${{ matrix.target }}
      - name: Generate dependency notices
        run: pnpm notices
      - name: Build installers
        run: pnpm exec electron-builder ${{ matrix.builder }} --publish never
      - name: Verify packaged runtime
        run: node scripts/release-check.mjs native ${{ matrix.target }} --packaged
      - name: Prepare installer artifacts
        run: node scripts/release-check.mjs stage ${{ matrix.target }}
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: release/upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download all platform installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release/download
          merge-multiple: true
      - name: Publish verified assets
        run: node scripts/release-publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
