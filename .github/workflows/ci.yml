name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify platforms
    uses: ./.github/workflows/build.yml
    with:
      source: ${{ github.sha }}
      installers: false
